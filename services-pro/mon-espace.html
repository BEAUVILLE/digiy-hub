<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mon espace — SERVICES PRO</title>
<style>
:root{--g:#073f32;--gold:#d8ad46;--cream:#f6f1e5;--paper:#fffefa;--ink:#173b31;--muted:#6e8179;--line:#dfe8e2}
*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:system-ui;color:var(--ink)}.wrap{width:min(100% - 24px,900px);margin:auto;padding:18px 0 40px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:950;font-size:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 10px 28px rgba(7,63,50,.06)}.grid{display:grid;gap:12px}.hero-card{background:linear-gradient(145deg,#073f32,#0d634b);color:#fff;border:0}.hero-card .small{color:#d7e7df}.hero-card h2{font-size:30px;margin:4px 0}.trade{font-size:23px;font-weight:950;line-height:1.15;margin:4px 0 12px}.country,.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900}.country{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff}.badge{background:#fff2bf;border:1px solid #d8ad46;color:#173b31}.statusline{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.statusdot{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12px;font-weight:850}.statusdot::before{content:"";width:8px;height:8px;border-radius:50%;background:#d8ad46}.statusdot.live::before{background:#71d38b}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.step{border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;background:#fff}.step strong{display:block;font-size:12px}.step span{font-size:11px;color:var(--muted)}.step.active{border-color:#d8ad46;background:#fff8df}.panel-title{font-size:16px;margin:0 0 8px}.contact-grid{display:grid;gap:10px}.metric{background:#edf5ef;border:1px solid var(--line);border-radius:14px;padding:11px}.metric strong{display:block;font-size:12px}.metric span{font-size:13px;color:var(--muted)}@media(min-width:760px){.grid{grid-template-columns:1.1fr .9fr}.contact-grid{grid-template-columns:repeat(3,1fr)}}.field{display:grid;gap:6px;margin:12px 0}input{padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit}.btn{display:inline-block;border:0;border-radius:999px;padding:11px 14px;background:var(--g);color:#fff;font-weight:900;text-decoration:none;cursor:pointer}.secondary{background:#ece7d8;color:var(--ink)}.small{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.logout{border:0;border-radius:999px;padding:9px 12px;font-weight:900;cursor:pointer}.qr{display:grid;place-items:center;padding:12px}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div><div class="small">🧭 DIGIY SERVICES PRO</div><div class="brand">Mon espace</div></div><button class="logout" id="logout">Déconnexion</button></div>
<div id="content"><div class="card">Chargement…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const sb=supabase.createClient("https://wesqmwjjtsefyjnluosj.supabase.co","sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const labels={card:"Carte DIGIY",fiche:"Fiche professionnelle",site:"Site professionnel"};
async function boot(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){location.replace("./acces-proprietaire.html");return}
 const {data,error}=await sb.rpc("digiy_services_pro_owner_profiles_v2");
 if(error||!data?.length){document.getElementById("content").innerHTML='<div class="card">Aucune présence SERVICES PRO rattachée à ce compte.</div>';return}
 document.getElementById("content").innerHTML=data.map((p,i)=>{
   const url=new URL("./carte.html?slug="+encodeURIComponent(p.slug),location.href).href;
   const levelIndex={card:0,fiche:1,site:2}[p.presence_level]??0;
   return '<section class="card hero-card"><div class="small">MON IDENTITÉ DIGIY</div><h2>'+esc(p.display_name)+'</h2><div class="trade">'+esc(p.profession_code||"À compléter")+'</div><div class="statusline"><span class="country">'+esc(p.country)+'</span><span class="badge">'+esc(labels[p.presence_level]||p.presence_level)+'</span><span class="statusdot '+(p.is_published?'live':'')+'">'+(p.is_published?'Visible publiquement':'Non publiée')+'</span></div><div class="steps"><div class="step '+(levelIndex===0?'active':'')+'"><strong>Carte</strong><span>Présence directe</span></div><div class="step '+(levelIndex===1?'active':'')+'"><strong>Fiche</strong><span>Présentation enrichie</span></div><div class="step '+(levelIndex===2?'active':'')+'"><strong>Site</strong><span>Présence complète</span></div></div></section><section class="grid"><div class="card"><h3 class="panel-title">🪪 Ma carte DIGIY</h3><p class="small">'+(p.card_access_mode==="free"?'Carte gratuite':'Carte avec adhésion')+(p.is_published?' · QR personnel':' · Carte non publiée · QR disponible après publication')+'</p><div class="actions">'+(p.is_published?'<a class="btn" target="_blank" href="'+esc(url)+'">Voir ma carte</a>':'')+'<a class="btn secondary" target="_blank" href="https://digiylyfe.com/tarifs-adherents-1.html?country=sn#fiche-pro">Passer à la fiche</a><a class="btn secondary" target="_blank" href="https://digiylyfe.com/tarifs-adherents-1.html?country=sn#site">Voir les sites</a></div>'+(p.is_published?'<div class="qr" id="qr-'+i+'"></div>':'')+'</div><div class="card"><h3 class="panel-title">📍 Mes informations courantes</h3><div class="contact-grid"><div class="metric"><strong>Zone</strong><span>'+esc(p.zone||"À compléter")+'</span></div><div class="metric"><strong>Téléphone</strong><span>'+esc(p.phone||"À compléter")+'</span></div><div class="metric"><strong>WhatsApp</strong><span>'+esc(p.whatsapp||"À compléter")+'</span></div></div><div class="field"><label>Modifier ma zone</label><input id="zone-'+i+'" value="'+esc(p.zone||"")+'"></div><div class="field"><label>Modifier mon téléphone</label><input id="phone-'+i+'" value="'+esc(p.phone||"")+'"></div><div class="field"><label>Modifier mon WhatsApp</label><input id="wa-'+i+'" value="'+esc(p.whatsapp||"")+'"></div><button class="btn" data-save="'+i+'" data-id="'+esc(p.id)+'">Enregistrer mes modifications</button><p class="small">Identité, métier, niveau commercial et publication restent protégés par DIGIY.</p>'+(p.presence_level==="fiche"||p.presence_level==="site"?'<div class="card" style="margin-top:16px"><h3 class="panel-title">📸 Photos et médias</h3><p class="small">Vos photos restent chez vous.</p><p class="small">Déposez-les sur votre espace habituel — Google Drive, Google Photos, Google Business, votre site ou tout autre hébergeur public — puis copiez simplement ici les <strong>URLs publiques</strong>.</p><p class="small">Pour vos médias, même principe : YouTube, LinkedIn, Instagram, portfolio, vidéo ou autre lien professionnel.</p><p class="small"><strong>DIGIYLYFE ne stocke pas vos fichiers : nous affichons vos liens.</strong> Vous gardez ainsi la maîtrise de vos contenus, et votre présence reste simple à mettre à jour.</p><div class="field"><label>URLs photos · une par ligne</label><textarea id="photos-'+i+'" style="min-height:110px">'+esc((p.photo_urls||[]).join("\n"))+'</textarea></div><div class="field"><label>URLs médias · une par ligne</label><textarea id="media-'+i+'" style="min-height:110px">'+esc((p.media_links||[]).map(x=>typeof x==="string"?x:(x?.url||"")).join("\n"))+'</textarea></div><button class="btn" data-save-media="'+i+'" data-id="'+esc(p.id)+'">Enregistrer mes URLs</button></div>':'')+'</div></section>';
 }).join("");
 data.forEach((p,i)=>{if(!p.is_published)return;const url=new URL("./carte.html?slug="+encodeURIComponent(p.slug),location.href).href;const target=document.getElementById("qr-"+i);if(target)new QRCode(target,{text:url,width:140,height:140})});
 document.querySelectorAll("[data-save]").forEach(btn=>btn.onclick=()=>save(btn.dataset.save,btn.dataset.id));
 document.querySelectorAll("[data-save-media]").forEach(btn=>btn.onclick=()=>saveMedia(btn.dataset.saveMedia,btn.dataset.id));
}
async function save(i,id){
 const {error}=await sb.rpc("digiy_services_pro_owner_update_card_v1",{p_id:id,p_zone:document.getElementById("zone-"+i).value.trim(),p_phone:document.getElementById("phone-"+i).value.trim(),p_whatsapp:document.getElementById("wa-"+i).value.trim()});
 alert(error?"⚠️ "+error.message:"✅ Informations mises à jour.");
 if(!error) boot();
}
const isPublicWebUrl=value=>{
 try{
  const u=new URL(value);
  return u.protocol==="https:"||u.protocol==="http:";
 }catch{return false}
};
async function saveMedia(i,id){
 const photos=(document.getElementById("photos-"+i)?.value||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
 const urls=(document.getElementById("media-"+i)?.value||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
 const invalid=[...photos,...urls].filter(url=>!isPublicWebUrl(url));
 if(invalid.length){
  alert("⚠️ URL invalide : "+invalid[0]+"\nUtilisez un lien public commençant par http:// ou https://");
  return;
 }
 const media=urls.map(url=>({url}));
 const {error}=await sb.rpc("digiy_services_pro_owner_update_media_v1",{p_id:id,p_photo_urls:photos,p_media_links:media});
 alert(error?"⚠️ "+error.message:"✅ URLs photos et médias mises à jour.");
 if(!error) boot();
}
document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.replace("./acces-proprietaire.html")};
boot();
</script>
</body>
</html>
