<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carte DIGIY — SERVICES PRO</title>
<meta name="robots" content="index,follow">
<style>
:root{--bg:#f5f2e8;--card:#fffdf7;--ink:#173b31;--muted:#66746d;--line:#ddd5c2;--accent:#0f6b4f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:system-ui;color:var(--ink);padding:18px}.card{width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 22px 70px rgba(23,59,49,.13)}.hero{background:linear-gradient(145deg,#073f32,#0d634b);color:#fff;padding:26px}.eyebrow{font-size:12px;font-weight:950;letter-spacing:.09em;color:#f0d98b}.identity{margin-top:14px}.identity h1{margin:0;font-size:38px;line-height:1.02}.trade{font-size:23px;font-weight:950;margin-top:7px}.trade-label{font-size:13px;font-weight:850;opacity:.78;vertical-align:middle}.territory{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:12px;font-weight:850}.body{padding:22px}.meta{color:var(--muted);margin:4px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{display:inline-block;text-decoration:none;border-radius:999px;padding:13px 16px;background:var(--accent);color:#fff;font-weight:950;text-align:center}.btn.secondary{background:#ece7d8;color:var(--ink)}.direct{background:#edf5ef;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:16px}.direct strong{display:block;font-size:13px}.direct span{color:var(--muted);font-size:13px}.qrbox{margin-top:18px;border-top:1px solid var(--line);padding-top:18px;text-align:center}#qr{display:grid;place-items:center}.premium{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.media-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.media-list a{font-size:12px;font-weight:850;text-decoration:none;padding:8px 10px;border-radius:999px;background:#ece7d8;color:var(--ink)}.small{font-size:13px;color:var(--muted)}@media(max-width:520px){.identity h1{font-size:32px}.trade{font-size:20px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="card" id="card"><div class="meta">Chargement…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const sb=supabase.createClient("https://wesqmwjjtsefyjnluosj.supabase.co","sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function boot(){
 const slug=new URLSearchParams(location.search).get("slug");
 const box=document.getElementById("card");
 if(!slug){box.innerHTML="<p>Carte introuvable.</p>";return}
 const {data,error}=await sb.rpc("digiy_services_pro_public_professional_by_slug_v2",{p_slug:slug});
 const p=data?.[0];
 if(error||!p){box.innerHTML="<p>Carte indisponible.</p>";return}
 const wa=(p.whatsapp||p.phone||"").replace(/\D/g,"");
 const premium=p.presence_level!=="card";
 box.innerHTML='<div class="hero"><div class="eyebrow">🧭 DIGIY SERVICES PRO</div><div class="identity"><h1>'+esc(p.display_name)+'</h1><div class="trade"><span class="trade-label">Métier :</span> '+esc(p.profession_code)+'</div><span class="territory">'+esc(p.zone)+' · '+esc(p.country)+'</span></div></div><div class="body">'+
   '<div class="direct"><strong>Contact direct</strong><span>0 % commission DIGIYLYFE</span></div>'+
   '<div class="actions">'+(wa?'<a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+esc(wa)+'">WhatsApp</a>':'')+
   (p.phone?'<a class="btn secondary" href="tel:'+esc(p.phone)+'">Appeler</a>':'')+'</div>'+
   (premium?'<div class="premium">'+(p.organization_name?'<strong>'+esc(p.organization_name)+'</strong>':'')+(p.credentials_text?'<p class="small">'+esc(p.credentials_text)+'</p>':'')+(p.description?'<p>'+esc(p.description)+'</p>':'')+(p.website_url?'<p><a href="'+esc(p.website_url)+'" target="_blank" rel="noopener">Site professionnel</a></p>':'')+(p.maps_url?'<p><a href="'+esc(p.maps_url)+'" target="_blank" rel="noopener">Google Maps</a></p>':'')+((p.photo_urls||[]).length?'<div class="gallery">'+(p.photo_urls||[]).map(u=>'<img src="'+esc(u)+'" alt="Photo professionnelle" loading="lazy">').join('')+'</div>':'')+((p.media_links||[]).length?'<div class="media-list">'+(p.media_links||[]).map((m,j)=>'<a href="'+esc(typeof m==="string"?m:(m?.url||""))+'" target="_blank" rel="noopener">Média '+(j+1)+'</a>').join('')+'</div>':'')+'</div>':'')+
   '<div class="qrbox"><div id="qr"></div><p class="small">Scannez pour retrouver cette carte DIGIY.</p></div></div>';
 new QRCode(document.getElementById("qr"),{text:location.href,width:150,height:150});
}
boot();
</script>
</body>
</html>
