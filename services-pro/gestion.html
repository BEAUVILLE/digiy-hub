<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SERVICES PRO — Gestion DIGIY</title>
<style>
:root{--bg:#f5f2e8;--card:#fffdf7;--ink:#173b31;--muted:#66746d;--line:#ddd5c2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui}.wrap{max-width:920px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.meta{color:var(--muted);font-size:13px}.need{white-space:pre-wrap}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff5cf;border:1px solid #ead28a;font-size:12px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button,.logout{border:0;border-radius:999px;padding:9px 12px;font-weight:900;cursor:pointer}.approve{background:#0f6b4f;color:#fff}.reject{background:#7d2f2f;color:#fff}.plain{background:#ece7d8;color:#173b31}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div><div class="meta">🧭 DIGIY SERVICES PRO</div><h1>Gestion DIGIY</h1></div><button class="logout" id="logout">Déconnexion</button></div>
<p>Demandes reçues avant qualification et mise en relation.</p>
<div id="status" class="card">Chargement…</div>
<div id="list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://wesqmwjjtsefyjnluosj.supabase.co","sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3");
const statusBox=document.getElementById("status"),list=document.getElementById("list");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const labels={pending_review:"En attente",approved:"Validée",rejected:"Refusée",matched:"Mise en relation",closed:"Clôturée"};
async function boot(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){location.replace("./acces-digiy.html");return}
 const {data:ok,error:ae}=await sb.rpc("digiy_services_pro_admin_access_v1");
 if(ae||ok!==true){await sb.auth.signOut();location.replace("./acces-digiy.html");return}
 const {data,error}=await sb.rpc("digiy_services_pro_admin_requests_v1");
 if(error){statusBox.textContent="⚠️ "+error.message;return}
 statusBox.textContent=(data||[]).length+" demande(s)";
 list.innerHTML=(data||[]).map(r=>{
  const actions=r.status==="closed"?"":'<div class="actions">'+
   (r.status!=="approved"?'<button class="approve" data-id="'+esc(r.id)+'" data-status="approved">✅ Valider</button>':'')+
   (r.status!=="matched"?'<button class="plain" data-id="'+esc(r.id)+'" data-status="matched">🤝 Mise en relation</button>':'')+
   (r.status!=="rejected"?'<button class="reject" data-id="'+esc(r.id)+'" data-status="rejected">❌ Refuser</button>':'')+
   '<button class="plain" data-id="'+esc(r.id)+'" data-status="closed">🔒 Clôturer</button></div>';
  return '<article class="card"><div><strong>'+esc(r.profession_code)+'</strong> · '+esc(r.requester_name)+'</div><div class="meta">'+esc(r.zone)+' · '+esc(r.country)+(r.period_text?' · '+esc(r.period_text):'')+'</div><p class="need">'+esc(r.need_text)+'</p><div class="meta">☎ '+esc(r.phone)+'</div><span class="status">'+esc(labels[r.status]||r.status)+'</span>'+actions+'</article>';
 }).join("")||'<div class="card">Aucune demande reçue.</div>';
 document.querySelectorAll("[data-status]").forEach(btn=>btn.onclick=()=>setStatus(btn.dataset.id,btn.dataset.status));
}
async function setStatus(id,next){
 const {error}=await sb.rpc("digiy_services_pro_admin_set_status_v1",{p_id:id,p_status:next});
 if(error){alert("⚠️ "+error.message);return}
 await boot();
}
document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.replace("./acces-digiy.html")};
boot();
</script>
</body>
</html>
