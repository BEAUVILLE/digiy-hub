<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SERVICES PRO — Gestion DIGIY</title>
<style>
:root{--bg:#f5f2e8;--card:#fffdf7;--ink:#173b31;--muted:#66746d;--line:#ddd5c2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui}.wrap{max-width:920px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.meta{color:var(--muted);font-size:13px}.need{white-space:pre-wrap}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff5cf;border:1px solid #ead28a;font-size:12px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button,.logout{border:0;border-radius:999px;padding:9px 12px;font-weight:900;cursor:pointer}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}.field textarea{min-height:80px;resize:vertical}.approve{background:#0f6b4f;color:#fff}.reject{background:#7d2f2f;color:#fff}.plain{background:#ece7d8;color:#173b31}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div><div class="meta">🧭 DIGIY SERVICES PRO</div><h1>Gestion DIGIY</h1></div><button class="logout" id="logout">Déconnexion</button></div>
<p>Demandes reçues avant qualification et mise en relation.</p>
<div id="status" class="card">Chargement…</div>
<div id="list"></div>
<section class="card">
<h2 id="proFormTitle">➕ Ajouter un professionnel</h2><input type="hidden" id="proId">
<p class="meta">Parcours commercial central : <a href="https://digiylyfe.com/tarifs-adherents-1.html?country=sn" target="_blank" rel="noopener">Tarifs adhérents</a> · <a href="https://digiylyfe.com/tarifs-adherents-1.html?country=sn#fiche-pro" target="_blank" rel="noopener">Fiche pro</a> · <a href="https://digiylyfe.com/tarifs-adherents-1.html?country=sn#site" target="_blank" rel="noopener">Site</a>.</p>
<div class="field"><label>Slug</label><input id="proSlug" placeholder="cabinet-dupont-dakar"></div>
<div class="field"><label>Profession</label><input id="proProfession" placeholder="architecte, comptable, geometre…"></div>
<div class="field"><label>Nom affiché</label><input id="proName"></div>
<div class="field"><label>Cabinet / organisation</label><input id="proOrg"></div>
<div class="field"><label>Zone</label><input id="proZone"></div>
<div class="field"><label>Pays</label><input id="proCountry" value="Sénégal"></div>
<div class="field"><label>Téléphone</label><input id="proPhone"></div>
<div class="field"><label>WhatsApp</label><input id="proWhatsapp"></div>
<div class="field"><label>Email</label><input id="proEmail"></div>
<div class="field"><label>Description</label><textarea id="proDescription"></textarea></div>
<div class="field"><label>Qualifications / agréments</label><textarea id="proCredentials"></textarea></div>
<div class="field"><label>Site web</label><input id="proWebsite"></div>
<div class="field"><label>Google Maps</label><input id="proMaps"></div>
<div class="field"><label>Niveau de présence</label><select id="proLevel"><option value="card">Carte DIGIY</option><option value="fiche">Fiche professionnelle</option><option value="site">Site professionnel</option></select></div>
<div class="field"><label>Mode commercial de la carte</label><select id="proCardMode"><option value="free">Carte gratuite</option><option value="subscription">Carte avec adhésion</option></select></div>
<label><input type="checkbox" id="proActive" checked> Actif</label>
<label><input type="checkbox" id="proPublished"> Publié</label>
<div class="actions"><button class="approve" id="savePro">💾 Enregistrer la fiche</button></div>
</section>
<section class="card">
<h2>👥 Professionnels SERVICES PRO</h2>
<div id="prosList" class="meta">Chargement…</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://wesqmwjjtsefyjnluosj.supabase.co","sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3");
const statusBox=document.getElementById("status"),list=document.getElementById("list"),prosList=document.getElementById("prosList");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const labels={pending_review:"En attente",approved:"Validée",rejected:"Refusée",matched:"Mise en relation",closed:"Clôturée"};
async function boot(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){location.replace("./acces-digiy.html");return}
 const {data:ok,error:ae}=await sb.rpc("digiy_services_pro_admin_access_v1");
 if(ae||ok!==true){await sb.auth.signOut();location.replace("./acces-digiy.html");return}
 const {data,error}=await sb.rpc("digiy_services_pro_admin_requests_v1");
 if(error){statusBox.textContent="⚠️ "+error.message;return}
 statusBox.textContent=(data||[]).length+" demande(s)";
 list.innerHTML=(data||[]).map(r=>{
  const actions=r.status==="closed"?"":'<div class="actions">'+
   (r.status!=="approved"&&r.status!=="matched"?'<button class="approve" data-id="'+esc(r.id)+'" data-status="approved">✅ Valider</button>':'')+
   (r.status==="approved"?'<button class="plain" data-match-request="'+esc(r.id)+'">🤝 Choisir un professionnel</button>':'')+
   (r.status!=="rejected"&&r.status!=="matched"?'<button class="reject" data-id="'+esc(r.id)+'" data-status="rejected">❌ Refuser</button>':'')+
   '<button class="plain" data-id="'+esc(r.id)+'" data-status="closed">🔒 Clôturer</button></div>'+
   '<div id="match-'+esc(r.id)+'"></div>';
  return '<article class="card"><div><strong>'+esc(r.profession_code)+'</strong> · '+esc(r.requester_name)+'</div><div class="meta">'+esc(r.zone)+' · '+esc(r.country)+(r.period_text?' · '+esc(r.period_text):'')+'</div><p class="need">'+esc(r.need_text)+'</p><div class="meta">☎ '+esc(r.phone)+'</div><span class="status">'+esc(labels[r.status]||r.status)+'</span>'+actions+'</article>';
 }).join("")||'<div class="card">Aucune demande reçue.</div>';
 document.querySelectorAll("[data-status]").forEach(btn=>btn.onclick=()=>setStatus(btn.dataset.id,btn.dataset.status));
 document.querySelectorAll("[data-match-request]").forEach(btn=>btn.onclick=()=>showMatchOptions(btn.dataset.matchRequest));
 await loadProfessionals();
}
async function setStatus(id,next){
 const {error}=await sb.rpc("digiy_services_pro_admin_set_status_v1",{p_id:id,p_status:next});
 if(error){alert("⚠️ "+error.message);return}
 await boot();
}
async function loadProfessionals(){
 const {data,error}=await sb.rpc("digiy_services_pro_admin_professionals_v1");
 if(error){prosList.textContent="⚠️ "+error.message;return}
 window.servicesPros=data||[];
 prosList.innerHTML=(data||[]).map(p=>'<div class="card"><strong>'+esc(p.display_name)+'</strong> · '+esc(p.profession_code)+'<div class="meta">'+esc(p.zone)+' · '+esc(p.country)+' · '+esc(p.presence_level||"card")+' · '+esc(p.card_access_mode||"free")+' · '+(p.is_published?'Publié':'Non publié')+' · '+(p.is_active?'Actif':'Inactif')+'</div><div class="actions"><a class="plain" style="text-decoration:none;padding:9px 12px;border-radius:999px" target="_blank" href="./carte.html?slug='+encodeURIComponent(p.slug)+'">🪪 Voir la carte</a></div><div class="meta">☎ '+esc(p.phone||"")+'</div><div class="actions"><button class="plain" data-edit-pro="'+esc(p.id)+'">✏️ Modifier</button></div></div>').join("")||'Aucun professionnel enregistré.';
 prosList.querySelectorAll("[data-edit-pro]").forEach(btn=>btn.onclick=()=>editProfessional(btn.dataset.editPro));
}
async function showMatchOptions(requestId){
 const box=document.getElementById("match-"+requestId);
 if(!box)return;
 await loadProfessionals();
 const pros=(window.servicesPros||[]).filter(p=>p.is_active);
 box.innerHTML='<div class="card"><strong>Choisir le professionnel</strong>'+pros.map(p=>'<div class="actions"><button class="plain" data-match-pro="'+esc(p.id)+'" data-request="'+esc(requestId)+'">'+esc(p.display_name)+' · '+esc(p.profession_code)+' · '+esc(p.zone)+'</button></div>').join("")+'</div>';
 box.querySelectorAll("[data-match-pro]").forEach(btn=>btn.onclick=()=>matchRequest(btn.dataset.request,btn.dataset.matchPro));
}
async function matchRequest(requestId,proId){
 const {error}=await sb.rpc("digiy_services_pro_admin_match_request_v1",{p_request_id:requestId,p_professional_id:proId});
 if(error){alert("⚠️ "+error.message);return}
 await boot();
}
function editProfessional(id){
 const p=(window.servicesPros||[]).find(x=>x.id===id);
 if(!p)return;
 document.getElementById("proId").value=p.id||"";
 document.getElementById("proSlug").value=p.slug||"";
 document.getElementById("proProfession").value=p.profession_code||"";
 document.getElementById("proName").value=p.display_name||"";
 document.getElementById("proOrg").value=p.organization_name||"";
 document.getElementById("proZone").value=p.zone||"";
 document.getElementById("proCountry").value=p.country||"Sénégal";
 document.getElementById("proPhone").value=p.phone||"";
 document.getElementById("proWhatsapp").value=p.whatsapp||"";
 document.getElementById("proEmail").value=p.email||"";
 document.getElementById("proDescription").value=p.description||"";
 document.getElementById("proCredentials").value=p.credentials_text||"";
 document.getElementById("proWebsite").value=p.website_url||"";
 document.getElementById("proMaps").value=p.maps_url||"";
 document.getElementById("proLevel").value=p.presence_level||"card";
 document.getElementById("proCardMode").value=p.card_access_mode||"free";
 document.getElementById("proActive").checked=!!p.is_active;
 document.getElementById("proPublished").checked=!!p.is_published;
 document.getElementById("proFormTitle").textContent="✏️ Modifier le professionnel";
 window.scrollTo({top:document.getElementById("proFormTitle").offsetTop-20,behavior:"smooth"});
}
document.getElementById("savePro").onclick=async()=>{
 const payload={
   p_id:document.getElementById("proId").value||null,
   p_slug:document.getElementById("proSlug").value.trim(),
   p_profession_code:document.getElementById("proProfession").value.trim(),
   p_display_name:document.getElementById("proName").value.trim(),
   p_organization_name:document.getElementById("proOrg").value.trim(),
   p_zone:document.getElementById("proZone").value.trim(),
   p_country:document.getElementById("proCountry").value.trim()||"Sénégal",
   p_phone:document.getElementById("proPhone").value.trim(),
   p_whatsapp:document.getElementById("proWhatsapp").value.trim(),
   p_email:document.getElementById("proEmail").value.trim(),
   p_description:document.getElementById("proDescription").value.trim(),
   p_credentials_text:document.getElementById("proCredentials").value.trim(),
   p_website_url:document.getElementById("proWebsite").value.trim(),
   p_maps_url:document.getElementById("proMaps").value.trim(),
   p_presence_level:document.getElementById("proLevel").value,
   p_card_access_mode:document.getElementById("proCardMode").value,
   p_is_active:document.getElementById("proActive").checked,
   p_is_published:document.getElementById("proPublished").checked
 };
 const {error}=await sb.rpc("digiy_services_pro_admin_upsert_professional_v2",payload);
 if(error){alert("⚠️ "+error.message);return}
 alert(document.getElementById("proId").value?"✅ Fiche professionnelle modifiée.":"✅ Fiche professionnelle enregistrée.");
 document.getElementById("proId").value="";
 document.getElementById("proFormTitle").textContent="➕ Ajouter un professionnel";
  ["proSlug","proProfession","proName","proOrg","proZone","proPhone","proWhatsapp","proEmail","proDescription","proCredentials","proWebsite","proMaps"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("proCountry").value="Sénégal";document.getElementById("proLevel").value="card";document.getElementById("proCardMode").value="free";document.getElementById("proActive").checked=true;document.getElementById("proPublished").checked=false;
 await loadProfessionals();
}
document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.replace("./acces-digiy.html")};
boot();
</script>
</body>
</html>
