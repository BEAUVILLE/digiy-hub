<head>

  <title>DIGIY HUB — Club des Métiers du Terrain · 8 langues</title>
  <meta name="description" content="DIGIY HUB — la gare centrale multilingue des métiers du terrain : portes publiques, portes professionnelles, contact direct et 0% commission.">
  <style>
    :root{--bar-h:52px;--bg:#03120c;--gold:#f6c453;--green:#00a651;--ink:#f8fafc;--line:rgba(255,255,255,.16)}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    .language-shell{height:var(--bar-h);padding:max(5px,env(safe-area-inset-top)) 8px 5px;background:linear-gradient(135deg,#061c12,#083923);border-bottom:1px solid rgba(246,196,83,.30);box-shadow:0 6px 20px rgba(0,0,0,.24);position:relative;z-index:20}
    .language-inner{height:100%;display:flex;align-items:center;gap:6px;max-width:1180px;margin:auto;min-width:0}
    .hub-mark{display:flex;align-items:center;gap:6px;flex:0 0 auto;color:#fff3cf;font-weight:1000;font-size:11px;letter-spacing:.03em;white-space:nowrap}
    .hub-mark span{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#22c55e);color:#06140f;font-size:16px}
    .language-buttons{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;flex:1;min-width:0;overflow:visible}
    .language-buttons button{min-width:0;height:29px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;padding:0 3px;font-weight:1000;font-size:9px;cursor:pointer;white-space:nowrap}
    .language-buttons button.active{background:linear-gradient(135deg,var(--gold),#22c55e);border-color:rgba(246,196,83,.62);color:#06140f;box-shadow:0 4px 12px rgba(0,0,0,.18)}
    .frame-wrap{position:relative;width:100%;height:calc(100dvh - var(--bar-h));background:#03120c}
    #hubFrame{display:block;width:100%;height:100%;border:0;background:#03120c}
    .loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,rgba(0,166,81,.28),transparent 55%),#03120c;color:#fff3cf;font-weight:1000;z-index:2;transition:opacity .18s ease}
    .loading.hidden{opacity:0;pointer-events:none}
    .loading span{padding:18px 22px;border-radius:20px;border:1px solid rgba(246,196,83,.28);background:rgba(255,255,255,.06)}
    html[dir="rtl"] .language-inner{direction:rtl}
    @media(max-width:720px){
      :root{--bar-h:48px}
      .language-shell{padding-left:5px;padding-right:5px}
      .hub-mark b{display:none}
      .hub-mark span{width:28px;height:28px;border-radius:9px;font-size:15px}
      .language-inner{gap:4px}
      .language-buttons{gap:2px}
      .language-buttons button{height:27px;font-size:8px;padding:0 2px}
    }
    @media(max-width:390px){.language-buttons button{font-size:7.5px}}
  </style>
  <script>
  (function(){
    'use strict';
    window.addEventListener('load',function(){
      (async function(){
        try{
          if('serviceWorker' in navigator){
            var registrations=await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(function(registration){
              return registration.unregister();
            }));
          }
          if('caches' in window){
            var keys=await caches.keys();
            await Promise.all(keys.filter(function(key){
              return key.indexOf('digiy-hub')!==-1;
            }).map(function(key){
              return caches.delete(key);
            }));
          }
        }catch(error){
          console.warn('[DIGIY HUB] nettoyage ancien cache différé',error);
        }
      })();
    });
  })();
  </script>
  <script>
  (function(){try{var p=new URLSearchParams(location.search);var l=(p.get('lang')||'').slice(0,2).toLowerCase();if(l==='pt')localStorage.setItem('digiy_hub_lang_7','fr');}catch(e){}})();
  </script>

  <script>
  (function(){
    'use strict';
    function fixFrameRoutes(){
      var frame=document.getElementById('hubFrame');
      if(!frame) return;
      try{
        var doc=frame.contentDocument;
        if(!doc) return;
        doc.querySelectorAll('a[href="https://driver.digiylyfe.com/"]').forEach(function(a){
          a.setAttribute('href','https://driver-client.digiylyfe.com/');
        });
        doc.querySelectorAll('a[href]').forEach(function(a){
          var raw=a.getAttribute('href')||'';
          if(!/^https:\/\//i.test(raw)) return;
          try{
            var url=new URL(raw);
            var host=url.hostname.toLowerCase();
            var ecosystem=(host==='digiylyfe.com'||host.endsWith('.digiylyfe.com')||host==='digiylyfe.net'||host.endsWith('.digiylyfe.net'));
            if(ecosystem) a.setAttribute('target','_top');
          }catch(_){}
        });
      }catch(e){}
    }
    window.addEventListener('load',function(){
      var frame=document.getElementById('hubFrame');
      if(!frame) return;
      frame.addEventListener('load',fixFrameRoutes);
      fixFrameRoutes();
    });
  })();
  </script>
</head>

    <div class="language-inner">
      <div class="hub-mark"><span>🧭</span><b>DIGIY HUB</b></div>
      <nav class="language-buttons" id="hubLanguages" aria-label="Choisir la langue">
        <button type="button" data-shell-lang="fr">FR</button>

        <button type="button" data-shell-lang="nl">NL</button>
        <button type="button" data-shell-lang="ar">AR</button>
      </nav>
    </div>
  </header>
  <main class="frame-wrap">
    <div class="loading" id="hubLoading"><span>DIGIY HUB…</span></div>
    <iframe id="hubFrame" title="DIGIY HUB" loading="eager" allow="clipboard-read; clipboard-write"></iframe>
  </main>
