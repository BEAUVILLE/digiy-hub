<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00853f">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://digiy-hub.digiylyfe.com/">
  <link rel="icon" href="./icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>DIGIY HUB — Club des Métiers du Terrain</title>
  <meta name="description" content="DIGIY HUB — la gare centrale multilingue des métiers du terrain : portes publiques, portes professionnelles, contact direct et 0% commission.">
  <style>
    :root{--bar-h:58px;--bg:#03120c;--gold:#f6c453;--green:#00a651;--ink:#f8fafc;--line:rgba(255,255,255,.16)}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    .language-shell{height:var(--bar-h);padding:max(7px,env(safe-area-inset-top)) 9px 7px;background:linear-gradient(135deg,#061c12,#083923);border-bottom:1px solid rgba(246,196,83,.30);box-shadow:0 8px 28px rgba(0,0,0,.28);position:relative;z-index:20}
    .language-inner{height:100%;display:flex;align-items:center;gap:8px;max-width:1180px;margin:auto;min-width:0}
    .hub-mark{display:flex;align-items:center;gap:8px;flex:0 0 auto;color:#fff3cf;font-weight:1000;font-size:12px;letter-spacing:.04em;white-space:nowrap}
    .hub-mark span{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#22c55e);color:#06140f;font-size:18px}
    .language-buttons{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:flex-end;min-width:0}
    .language-buttons::-webkit-scrollbar{display:none}
    .language-buttons button{flex:0 0 auto;min-height:36px;min-width:54px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;padding:0 10px;font-weight:1000;font-size:11px;cursor:pointer}
    .language-buttons button.active{background:linear-gradient(135deg,var(--gold),#22c55e);border-color:rgba(246,196,83,.62);color:#06140f;box-shadow:0 6px 16px rgba(0,0,0,.22)}
    .frame-wrap{position:relative;width:100%;height:calc(100dvh - var(--bar-h));background:#03120c}
    #hubFrame{display:block;width:100%;height:100%;border:0;background:#03120c}
    .loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,rgba(0,166,81,.28),transparent 55%),#03120c;color:#fff3cf;font-weight:1000;z-index:2;transition:opacity .18s ease}
    .loading.hidden{opacity:0;pointer-events:none}
    .loading span{padding:18px 22px;border-radius:20px;border:1px solid rgba(246,196,83,.28);background:rgba(255,255,255,.06)}
    html[dir="rtl"] .language-inner{direction:rtl}
    html[dir="rtl"] .language-buttons{justify-content:flex-start}
    @media(max-width:720px){:root{--bar-h:62px}.hub-mark b{display:none}.language-buttons{justify-content:flex-start}.language-buttons button{min-width:51px;padding:0 8px}}
  </style>
  <script>try{localStorage.setItem('digiy_hub_lang_v1','fr')}catch(e){}</script>
  <script src="./hub-7lang.js?v=20260730-hub7a" defer></script>
  <script src="./hub-bonne-affaire.js?v=20260801-ba1" defer></script>
  <script src="./hub-pro-cartouche.js?v=20260801-pro1" defer></script>
  <script src="./hub-pro-mobile-fix.js?v=20260801-pro2" defer></script>
  <script src="./hub-pro-personnalisation.js?v=20260801-pro3" defer></script>
  <script src="./hub-public-cartouche.js?v=20260801-public1" defer></script>
  <script src="./hub-public-grid-memory.js?v=20260801-public2" defer></script>
</head>
<body>
  <header class="language-shell" aria-label="DIGIY HUB languages">
    <div class="language-inner">
      <div class="hub-mark"><span>🧭</span><b>DIGIY HUB</b></div>
      <nav class="language-buttons" id="hubLanguages" aria-label="Choisir la langue">
        <button type="button" data-shell-lang="fr">🇫🇷 FR</button>
        <button type="button" data-shell-lang="en">🇬🇧 EN</button>
        <button type="button" data-shell-lang="es">🇪🇸 ES</button>
        <button type="button" data-shell-lang="de">🇩🇪 DE</button>
        <button type="button" data-shell-lang="it">🇮🇹 IT</button>
        <button type="button" data-shell-lang="nl">🇳🇱 NL</button>
        <button type="button" data-shell-lang="ar">🌙 AR</button>
      </nav>
    </div>
  </header>
  <main class="frame-wrap">
    <div class="loading" id="hubLoading"><span>DIGIY HUB…</span></div>
    <iframe id="hubFrame" title="DIGIY HUB" loading="eager" allow="clipboard-read; clipboard-write"></iframe>
  </main>
  <noscript><p><a href="./hub-core.html">Ouvrir DIGIY HUB</a></p></noscript>
</body>
</html>
