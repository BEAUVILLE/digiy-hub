name: WORLD8 territoires
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/world8-territories.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mettre Petite Côte et Dordogne en WORLD8
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          # 1) territoire.html : 8 boutons compacts + cache bust
          p=Path('territoire.html')
          s=p.read_text()
          old='.lang{display:flex;gap:6px}.lang button{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);color:#fff;padding:8px 11px;font-weight:900;cursor:pointer}.lang button.active{background:linear-gradient(135deg,var(--gold),var(--green));color:#06140f}'
          new='.lang{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;min-width:min(420px,58vw)}.lang button{min-width:0;height:30px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);color:#fff;padding:0 4px;font-size:9px;font-weight:900;cursor:pointer}.lang button.active{background:linear-gradient(135deg,var(--gold),var(--green));color:#06140f}@media(max-width:620px){.top{align-items:flex-start}.lang{min-width:0;flex:1;gap:2px}.lang button{height:27px;font-size:8px;padding:0 2px}.back{font-size:12px;white-space:nowrap}}'
          assert old in s, 'CSS langues introuvable'
          s=s.replace(old,new,1)
          old='<div class="top"><a class="back" href="./">← DIGIY HUB</a><div class="lang"><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button></div></div>'
          new='<div class="top"><a class="back" href="./">← DIGIY HUB</a><div class="lang" aria-label="Langues"><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button><button type="button" data-lang="pt">PT</button><button type="button" data-lang="de">DE</button><button type="button" data-lang="it">IT</button><button type="button" data-lang="nl">NL</button><button type="button" data-lang="ar">AR</button></div></div>'
          assert old in s, 'Barre FR/EN introuvable'
          s=s.replace(old,new,1)
          s=s.replace('./assets/js/territory.js?v=20260802-supabase1','./assets/js/territory.js?v=20260812-world8-territories-v1')
          p.write_text(s)

          # 2) needs.json : labels WORLD8
          p=Path('assets/data/needs.json')
          data=json.loads(p.read_text())
          labels={
            'transport':{'fr':'Se déplacer','en':'Get around','es':'Desplazarse','pt':'Deslocar-se','de':'Unterwegs sein','it':'Spostarsi','nl':'Verplaatsen','ar':'التنقل'},
            'artisan':{'fr':'Trouver un artisan','en':'Find a tradesperson','es':'Encontrar un artesano','pt':'Encontrar um artesão','de':'Handwerker finden','it':'Trovare un artigiano','nl':'Een vakman vinden','ar':'العثور على حرفي'},
            'accommodation':{'fr':'Dormir ou louer','en':'Stay or rent','es':'Alojarse o alquilar','pt':'Dormir ou alugar','de':'Übernachten oder mieten','it':'Dormire o affittare','nl':'Overnachten of huren','ar':'الإقامة أو الاستئجار'},
            'food':{'fr':'Manger ou réserver','en':'Eat or book','es':'Comer o reservar','pt':'Comer ou reservar','de':'Essen oder reservieren','it':'Mangiare o prenotare','nl':'Eten of reserveren','ar':'الأكل أو الحجز'},
            'shopping':{'fr':'Acheter local','en':'Shop local','es':'Comprar local','pt':'Comprar local','de':'Lokal einkaufen','it':'Comprare locale','nl':'Lokaal kopen','ar':'الشراء محلياً'},
            'jobs':{'fr':'Emploi et missions','en':'Jobs and gigs','es':'Empleo y misiones','pt':'Emprego e missões','de':'Jobs und Aufträge','it':'Lavoro e incarichi','nl':'Werk en opdrachten','ar':'وظائف ومهام'},
            'announcements':{'fr':'Annonces','en':'Listings','es':'Anuncios','pt':'Anúncios','de':'Anzeigen','it':'Annunci','nl':'Advertenties','ar':'إعلانات'},
            'guidance':{'fr':'La Voix','en':'Guidance','es':'La Voz','pt':'A Voz','de':'Die Stimme','it':'La Voce','nl':'De Stem','ar':'الصوت'}
          }
          for item in data['needs']:
            item['label']=labels[item['id']]
          data['version']=3
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          # 3) territories.json : noms/taglines WORLD8
          p=Path('assets/data/territories.json')
          data=json.loads(p.read_text())
          for t in data['territories']:
            if t['id']=='petite-cote':
              t['countryName']={'fr':'Sénégal','en':'Senegal','es':'Senegal','pt':'Senegal','de':'Senegal','it':'Senegal','nl':'Senegal','ar':'السنغال'}
              t['name']={k:'Petite Côte' for k in ['fr','en','es','pt','de','it','nl']}; t['name']['ar']='الساحل الصغير'
              t['tagline']={'fr':'Les professionnels du territoire, joignables directement.','en':'Local professionals, reachable directly.','es':'Profesionales del territorio, contactables directamente.','pt':'Profissionais do território, contactáveis diretamente.','de':'Professionelle aus der Region, direkt erreichbar.','it':'Professionisti del territorio, contattabili direttamente.','nl':'Professionals uit de regio, rechtstreeks bereikbaar.','ar':'مهنيون من المنطقة يمكن التواصل معهم مباشرة.'}
            else:
              t['countryName']={'fr':'France','en':'France','es':'Francia','pt':'França','de':'Frankreich','it':'Francia','nl':'Frankrijk','ar':'فرنسا'}
              t['name']={'fr':'Vallée de la Dordogne','en':'Dordogne Valley','es':'Valle del Dordoña','pt':'Vale da Dordogne','de':'Dordogne-Tal','it':'Valle della Dordogna','nl':'Dordognevallei','ar':'وادي دوردوني'}
              t['tagline']={'fr':'Les professionnels du territoire, joignables directement.','en':'Local professionals, reachable directly.','es':'Profesionales del territorio, contactables directamente.','pt':'Profissionais do território, contactáveis diretamente.','de':'Professionelle aus der Region, direkt erreichbar.','it':'Professionisti del territorio, contattabili direttamente.','nl':'Professionals uit de regio, rechtstreeks bereikbaar.','ar':'مهنيون من المنطقة يمكن التواصل معهم مباشرة.'}
            for z in t.get('zones',[]):
              base=z['name'].get('fr') or next(iter(z['name'].values()))
              z['name']={k:base for k in ['fr','en','es','pt','de','it','nl','ar']}
          data['version']=2
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          # 4) territory.js : moteur WORLD8 + persistance HUB
          p=Path('assets/js/territory.js')
          s=p.read_text()
          pattern=r"  var storedLanguage='';.*?  var copy=\{.*?\n  \};\n\n  function pick"
          replacement="""  var SUPPORTED=['fr','en','es','pt','de','it','nl','ar'];
  var requestedLanguage=(params.get('lang')||'').slice(0,2).toLowerCase();
  var storedLanguage='';
  try{storedLanguage=localStorage.getItem('digiy_hub_lang_8')||localStorage.getItem('digiy_hub_lang_7')||localStorage.getItem('digiy-lang')||'';}catch(e){}
  function validLanguage(value){value=String(value||'').slice(0,2).toLowerCase();return SUPPORTED.indexOf(value)>=0?value:'fr';}
  var state={lang:validLanguage(requestedLanguage||storedLanguage||'fr'),need:'',zone:'all',territories:[],needs:[],professionals:[],dataSource:'json'};
  var copy={
    fr:{needTitle:'Que recherchez-vous ?',zoneTitle:'Préciser la zone',all:'Tout le territoire',results:'professionnel(s) disponible(s)',empty:'Aucun professionnel ne correspond encore à ce filtre.',based:'Basé à',serves:'Intervient à',whole:'Tout le territoire',fixed:'Établissement fixe',mobile:'Service mobile',mixed:'Activité mixte',doctrine:'0 % commission DIGIY · Contact direct · Le professionnel garde la main.',loadError:'Impossible de charger les données territoriales.',profile:'Voir la fiche',whatsapp:'WhatsApp',call:'Appeler'},
    en:{needTitle:'What are you looking for?',zoneTitle:'Choose an area',all:'Whole territory',results:'professional(s) available',empty:'No professional matches this filter yet.',based:'Based in',serves:'Serves',whole:'Whole territory',fixed:'Fixed location',mobile:'Mobile service',mixed:'Mixed activity',doctrine:'0% DIGIY commission · Direct contact · The professional stays in control.',loadError:'Unable to load territory data.',profile:'View profile',whatsapp:'WhatsApp',call:'Call'},
    es:{needTitle:'¿Qué buscas?',zoneTitle:'Precisar la zona',all:'Todo el territorio',results:'profesional(es) disponible(s)',empty:'Ningún profesional coincide todavía con este filtro.',based:'Con base en',serves:'Interviene en',whole:'Todo el territorio',fixed:'Establecimiento fijo',mobile:'Servicio móvil',mixed:'Actividad mixta',doctrine:'0 % de comisión DIGIY · Contacto directo · El profesional mantiene el control.',loadError:'No se pueden cargar los datos territoriales.',profile:'Ver ficha',whatsapp:'WhatsApp',call:'Llamar'},
    pt:{needTitle:'O que procura?',zoneTitle:'Precisar a zona',all:'Todo o território',results:'profissional(is) disponível(is)',empty:'Ainda não há profissional correspondente a este filtro.',based:'Baseado em',serves:'Atua em',whole:'Todo o território',fixed:'Estabelecimento fixo',mobile:'Serviço móvel',mixed:'Atividade mista',doctrine:'0% de comissão DIGIY · Contacto direto · O profissional mantém o controlo.',loadError:'Não foi possível carregar os dados territoriais.',profile:'Ver ficha',whatsapp:'WhatsApp',call:'Ligar'},
    de:{needTitle:'Was suchen Sie?',zoneTitle:'Gebiet auswählen',all:'Gesamte Region',results:'verfügbare Fachkraft/Fachkräfte',empty:'Für diesen Filter ist noch kein Profi verfügbar.',based:'Ansässig in',serves:'Tätig in',whole:'Gesamte Region',fixed:'Fester Standort',mobile:'Mobiler Service',mixed:'Gemischte Tätigkeit',doctrine:'0 % DIGIY-Provision · Direkter Kontakt · Der Profi behält die Kontrolle.',loadError:'Gebietsdaten konnten nicht geladen werden.',profile:'Profil ansehen',whatsapp:'WhatsApp',call:'Anrufen'},
    it:{needTitle:'Cosa cerchi?',zoneTitle:'Scegli la zona',all:'Tutto il territorio',results:'professionista/i disponibile/i',empty:'Nessun professionista corrisponde ancora a questo filtro.',based:'Con sede a',serves:'Opera a',whole:'Tutto il territorio',fixed:'Sede fissa',mobile:'Servizio mobile',mixed:'Attività mista',doctrine:'0% commissione DIGIY · Contatto diretto · Il professionista mantiene il controllo.',loadError:'Impossibile caricare i dati territoriali.',profile:'Vedi scheda',whatsapp:'WhatsApp',call:'Chiama'},
    nl:{needTitle:'Wat zoekt u?',zoneTitle:'Kies de zone',all:'Hele gebied',results:'professional(s) beschikbaar',empty:'Nog geen professional voor dit filter.',based:'Gevestigd in',serves:'Actief in',whole:'Hele gebied',fixed:'Vaste locatie',mobile:'Mobiele dienst',mixed:'Gemengde activiteit',doctrine:'0% DIGIY-commissie · Direct contact · De professional houdt de regie.',loadError:'Gebiedsgegevens konden niet worden geladen.',profile:'Bekijk fiche',whatsapp:'WhatsApp',call:'Bellen'},
    ar:{needTitle:'ما الذي تبحث عنه؟',zoneTitle:'حدد المنطقة',all:'كل المنطقة',results:'مهني متاح',empty:'لا يوجد مهني مطابق لهذا الاختيار بعد.',based:'مقره في',serves:'يعمل في',whole:'كل المنطقة',fixed:'موقع ثابت',mobile:'خدمة متنقلة',mixed:'نشاط مختلط',doctrine:'عمولة DIGIY صفر · تواصل مباشر · المهني يبقى صاحب القرار.',loadError:'تعذر تحميل بيانات المنطقة.',profile:'عرض البطاقة',whatsapp:'واتساب',call:'اتصال'}
  };

  function pick"""
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          assert n==1, f'bloc langue/copy remplacé {n} fois'
          s=s2
          s=s.replace("document.documentElement.lang=state.lang;\n    document.title=", "document.documentElement.lang=state.lang;\n    document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';\n    document.title=",1)
          old="""    state.lang=button.dataset.lang;
    try{localStorage.setItem('digiy_hub_lang_v1',state.lang);}catch(e){}
    render();"""
          new="""    state.lang=validLanguage(button.dataset.lang);
    try{localStorage.setItem('digiy_hub_lang_8',state.lang);localStorage.setItem('digiy_hub_lang_7',state.lang==='pt'?'fr':state.lang);localStorage.setItem('digiy-lang',state.lang);}catch(e){}
    if(history.replaceState){var u=new URL(location.href);u.searchParams.set('lang',state.lang);history.replaceState({},'',u.pathname+u.search+u.hash);}
    render();"""
          assert old in s, 'handler langue introuvable'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Vérifier
        run: |
          grep -q 'data-lang="ar"' territoire.html
          grep -q "pt:{needTitle" assets/js/territory.js
          grep -q '"ar": "الصوت"' assets/data/needs.json
          grep -q '"pt": "Vale da Dordogne"' assets/data/territories.json
      - name: Commit
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add territoire.html assets/js/territory.js assets/data/needs.json assets/data/territories.json
          git commit -m 'Passer Petite Côte et Dordogne en 8 langues'
          git push
      - name: Retirer le workflow temporaire
        run: |
          git pull --rebase
          git rm .github/workflows/world8-territories.yml
          git commit -m 'Retirer workflow temporaire territoires'
          git push
