name: DIGIY clean old HUB return once
on:
  push:
    paths:
      - '.github/workflows/digiy-clean-old-hub-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove old HUB return
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('territoire.html')
          s=p.read_text(encoding='utf-8')
          s2=re.sub(r'<a\b(?![^>]*data-digiy-return-home="1")[^>]*>\s*←?\s*DIGIY HUB\s*</a>','',s,flags=re.I|re.S)
          if s2==s:
              raise SystemExit('Old HUB return not found')
          p.write_text(s2,encoding='utf-8')
          PY
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/digiy-clean-old-hub-once.yml
          git add territoire.html
          git diff --cached --quiet && exit 0
          git commit -m "Retirer ancien retour HUB des territoires"
          git push
