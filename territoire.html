<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DIGIY — Territoire</title>
  <meta name="description" content="Trouvez les professionnels d’un territoire DIGIY et contactez-les directement.">
  <style>
    :root{color-scheme:dark;--bg:#06150f;--panel:#0b2118;--line:rgba(255,255,255,.12);--text:#f8fafc;--muted:rgba(248,250,252,.7);--gold:#f6c453;--green:#22c55e;--cyan:#5eead4}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 480px at 0 0,rgba(246,196,83,.12),transparent 62%),radial-gradient(900px 480px at 100% 0,rgba(34,197,94,.13),transparent 62%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:22px 0 44px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.back{font-weight:900;text-decoration:none;color:#fff3cf}.lang{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;min-width:min(420px,58vw)}.lang button{min-width:0;height:30px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);color:#fff;padding:0 4px;font-size:9px;font-weight:900;cursor:pointer}.lang button.active{background:linear-gradient(135deg,var(--gold),var(--green));color:#06140f}
    .hero{margin-top:18px;padding:24px;border:1px solid rgba(246,196,83,.32);border-radius:28px;background:rgba(255,255,255,.045)}.eyebrow{color:var(--cyan);font-size:12px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase}.hero h1{margin:8px 0 8px;font-size:clamp(34px,7vw,64px);line-height:.95}.hero p{margin:0;color:var(--muted);font-weight:750}.doctrine{margin-top:15px;color:#fff3cf;font-weight:950}
    .section{margin-top:22px}.section h2{margin:0 0 12px;font-size:21px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.need,.chip{border:1px solid var(--line);background:rgba(255,255,255,.055);color:#fff;cursor:pointer}.need{min-height:96px;border-radius:20px;padding:14px;text-align:left}.need strong{display:block;font-size:25px}.need span{display:block;margin-top:8px;font-weight:950}.need.active{border-color:rgba(246,196,83,.65);background:rgba(246,196,83,.13)}.zones{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border-radius:999px;padding:10px 13px;font-weight:900}.chip.active{background:linear-gradient(135deg,#dff8ff,var(--cyan),var(--green));color:#052017}
    .results-section{scroll-margin-top:18px}.status{margin:14px 0;color:var(--muted);font-weight:850}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:16px;transition:border-color .25s,box-shadow .25s,transform .25s}.card.result-focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(246,196,83,.18),0 18px 45px rgba(0,0,0,.28);transform:translateY(-2px)}.card h3{margin:0;font-size:21px}.summary{margin:7px 0;color:var(--muted)}.meta{font-size:13px;font-weight:850;line-height:1.55}.services{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.service{border-radius:999px;background:rgba(255,255,255,.07);padding:6px 9px;font-size:11px;font-weight:850}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions a{border-radius:13px;padding:10px 12px;background:linear-gradient(135deg,var(--gold),var(--green));color:#06140f;text-decoration:none;font-size:12px;font-weight:1000}.empty{padding:22px;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}
    @media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:1fr}.hero{padding:19px}.results-section{scroll-margin-top:10px}}
    @media(max-width:620px){.top{align-items:flex-start}.lang{min-width:0;flex:1;gap:2px}.lang button{height:27px;font-size:8px;padding:0 2px}.back{font-size:12px;white-space:nowrap}}
    @media(max-width:430px){.wrap{width:min(100% - 18px,1100px)}.need{min-height:82px;padding:12px}.need strong{font-size:22px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}.card.result-focus{transform:none}}
    html[dir="rtl"] body{text-align:right}html[dir="rtl"] .need{text-align:right}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><a class="back" href="./">← DIGIY HUB</a><div class="lang" aria-label="Langues"><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button><button type="button" data-lang="pt">PT</button><button type="button" data-lang="de">DE</button><button type="button" data-lang="it">IT</button><button type="button" data-lang="nl">NL</button><button type="button" data-lang="ar">AR</button></div></div>
    <section class="hero"><div class="eyebrow" id="country"></div><h1 id="territoryName">DIGIY</h1><p id="tagline"></p><div class="doctrine">0 % commission DIGIY · Contact direct · Le professionnel garde la main.</div></section>
    <section class="section"><h2 id="needTitle">Que recherchez-vous ?</h2><div class="grid" id="needs"></div></section>
    <section class="section"><h2 id="zoneTitle">Préciser la zone</h2><div class="zones" id="zones"></div></section>
    <section class="section results-section" id="resultSection"><div class="status" id="status"></div><div class="cards" id="results"></div></section>
  </main>
  <script>try{localStorage.setItem('digiy_hub_lang_v1','fr')}catch(e){}</script>
  <script src="./assets/js/territory.js?v=20260802-supabase1" defer></script>
  <script src="./assets/js/territory-world8.js?v=20260812-territory-world8-v1" defer></script>
</body>
</html>
